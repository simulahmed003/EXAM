<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Psychrometric chart</title><style>/* shared styles for the interactive charts and the numericals pages */
:root{--ink:#1d2433;--mute:#5b6475;--line:#d9dee7;--bg:#ffffff;--soft:#f5f7fa;--und:#eef0f3;--und-b:#9aa3b2;--exam:#eaf7ee;--exam-b:#2e9d55;--acc:#0b63c5}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:21px;margin:30px 0 8px;border-bottom:2px solid var(--line);padding-bottom:4px}
h3{font-size:17px;margin:18px 0 6px}
.sub{color:var(--mute);margin:0 0 14px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:99px;margin-right:6px;vertical-align:2px}
.tag.u{background:#dfe3e9;color:#3b4454}.tag.x{background:#c9ecd5;color:#16602f}
.box{border-radius:10px;padding:12px 16px;margin:12px 0}
.und{background:var(--und);border:1px solid var(--und-b)}
.und>.lab,.exam>.lab{font-weight:700;font-size:13px;letter-spacing:.03em;margin-bottom:6px}
.und>.lab{color:#3b4454}.exam>.lab{color:#16602f}
.exam{background:var(--exam);border:2px solid var(--exam-b)}
.prob{background:#fff8e6;border:1px solid #e9c46a}
.script{background:#fff;border:1px dashed #9ccfac;border-radius:8px;padding:12px 16px;font-family:"Segoe Print","Comic Sans MS","Bradley Hand",cursive;font-size:15px;line-height:1.75}
.script table{font-family:inherit}
.boxed{display:inline-block;border:2px solid #16602f;padding:0 8px;border-radius:4px;font-weight:700}
table.t{border-collapse:collapse;margin:6px 0;font-size:14px}
table.t td,table.t th{border:1px solid #c4cad4;padding:3px 9px;text-align:center}
table.t th{background:#e6eaf0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.col h4{margin:2px 0 6px}
figure{margin:10px 0;text-align:center}figure img{max-width:100%;border:1px solid var(--line);border-radius:6px}
figcaption{font-size:13px;color:var(--mute);margin-top:4px}
.credit{font-size:11.5px;color:var(--mute);text-align:left}
.mist li{margin:3px 0}
.toc a{color:var(--acc);text-decoration:none}.toc li{margin:2px 0}
.link{font-size:13px}
/* ---- p-h explorer ---- */
.phx{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--soft);margin:12px 0}
.phx-top{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:6px;font-size:14px}
.phx-top select{font-size:14px;padding:2px}
.phx-ctl{display:block}
.phx-sl{display:inline-flex;align-items:center;gap:6px;margin:3px 16px 3px 0;font-size:14px}
.phx-sl span{min-width:150px}.phx-sl input{width:150px}.phx-sl b{min-width:58px}
.phx-btns{margin:6px 0}.phx-btns button,.ctl button{font-size:14px;padding:5px 12px;margin-right:8px;border-radius:6px;border:1px solid #9aa3b2;background:#fff;cursor:pointer}
.phx-btns button:hover{background:#e9eef6}
.phx-svg{width:100%;height:auto;display:block;background:#fff;border-radius:6px;touch-action:none}
.phx-bg{fill:#fff}.phx-frame{fill:none;stroke:#333;stroke-width:1.2}
.phx-grid{stroke:#eceff3;stroke-width:1}.phx-grid2{stroke:#d5dae2;stroke-width:1}
.phx-dome{fill:none;stroke:#111;stroke-width:2.6}
.phx-t{fill:none;stroke:#e0475b;stroke-width:.9;opacity:.75}
.phx-s{fill:none;stroke:#2c9a4b;stroke-width:.8;stroke-dasharray:5 3;opacity:.8}
.phx-v{fill:none;stroke:#2f6fd6;stroke-width:.8;opacity:.75}
.phx-x{fill:none;stroke:#888;stroke-width:.7;opacity:.7}
.phx-lt{font-size:10px;fill:#c0283c}.phx-ls{font-size:9.5px;fill:#1f7a39}.phx-lv{font-size:9.5px;fill:#2357a8}.phx-lx{font-size:9.5px;fill:#666;text-anchor:middle}
.phx-dl{font-size:11px;font-style:italic;fill:#111}
.phx-ax{font-size:11.5px;fill:#333}.phx-axt{font-size:13px;fill:#222}.phx-title{font-size:13px;font-weight:600;fill:#222}
.phx-drop{stroke:#555;stroke-width:1;stroke-dasharray:3 3}
.phx-pt{fill:#fff;stroke:#111;stroke-width:2}
.phx-pl{font-size:17px;font-weight:700;fill:#111;paint-order:stroke;stroke:#fff;stroke-width:4px}
.phx-hv{font-size:11.5px;font-weight:600;fill:#111;paint-order:stroke;stroke:#fff;stroke-width:3px}
.phx-pv{font-size:12px;font-weight:600;fill:#333;paint-order:stroke;stroke:#fff;stroke-width:3px}
.phx-zone{stroke:#ffd23f;stroke-width:12;opacity:.55;stroke-linecap:round}.phx-zl{font-size:12px;font-weight:600;fill:#7a5a00;paint-order:stroke;stroke:#fff;stroke-width:3px}
.phx-cross{stroke:#0b63c5;stroke-width:.8;stroke-dasharray:2 2}
.phx-tip{font-size:11.5px;fill:#fff}.phx-tip-bg{fill:#0b3d75;opacity:.9}
.phx-info{margin:6px 2px;font-size:14px;min-height:22px}
.phx-out{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:4px 12px;font-size:14px;margin:6px 2px}
.phx-out div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dotted #c4cad4}
.phx-out span{color:var(--mute)}
.phx-rows{background:#fff;border:1px solid #e9c46a;border-radius:8px;padding:8px 12px;margin-top:8px;font-size:14px}
.phx-note{font-size:13px;color:#7a4b00;margin:4px 0 0}
/* ---- generic small interactives ---- */
.ix{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--soft);margin:12px 0}
.ix svg{width:100%;height:auto;display:block;background:#fff;border-radius:6px}
.ix .ctl{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;margin-bottom:6px}
.ix .ctl label{display:inline-flex;align-items:center;gap:6px}
.ix .ctl input[type=range]{width:140px}
.ix .ctl input[type=number]{width:70px}
.ix .res{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 12px;font-size:14px;margin-top:6px}
.ix .res div{display:flex;justify-content:space-between;border-bottom:1px dotted #c4cad4}
.ix .res span{color:var(--mute)}
@media print{
 body{font-size:11.5pt}.wrap{max-width:none;padding:0}
 .phx-ctl,.ix .ctl,.phx-btns,.noprint{display:none!important}
 .phx,.ix,.box,figure,table{break-inside:avoid}
 h2{break-before:page}
 .phx-rows{display:block!important}
 .two{grid-template-columns:1fr 1fr!important}.two .box{font-size:10pt}
 figure img{max-width:88%!important}
 .printonly{display:block!important}
}
.printonly{display:none}
.psy-sat{fill:none;stroke:#111;stroke-width:2.4}.psy-rh{fill:none;stroke:#2c9a4b;stroke-width:.9}.psy-lrh{font-size:10.5px;fill:#1f7a39;font-weight:600}
.psy-wb{fill:none;stroke:#e0475b;stroke-width:.7;stroke-dasharray:4 3;opacity:.7}.psy-wb2{fill:none;stroke:#e0475b;stroke-width:1.1;stroke-dasharray:4 3}
.psy-h{stroke:#777;stroke-width:.7;opacity:.6}.psy-lh{font-size:10.5px;fill:#555}
.psy-v{fill:none;stroke:#2f6fd6;stroke-width:.7;opacity:.6}.psy-lv{font-size:9.5px;fill:#2357a8}
.dct-d{stroke:#222;stroke-width:1}.dct-ld{font-size:10.5px;fill:#222;font-weight:600}.dct-v{fill:none;stroke:#2f6fd6;stroke-width:1;stroke-dasharray:6 3}.dct-lv{font-size:10.5px;fill:#2357a8}

.phx-work{grid-column:1/-1;background:#fff;border:1px solid #c4cad4;border-radius:8px;padding:8px 12px;margin:6px 0;font-size:14px;line-height:1.7}

<body><a class="hubbtn" href="../../ESE4025_Start_Here.html" style="position:fixed;top:10px;right:12px;z-index:99999;font:700 13px/1 'Segoe UI',system-ui,Arial,sans-serif;background:#c0392b;color:#fff;text-decoration:none;padding:9px 13px;border-radius:999px;box-shadow:0 2px 8px #0005">&#8962; All materials</a><div class="wrap"><h1>Psychrometric chart</h1><p class="sub">Hover to read any state. ASHRAE moist-air equations at 101.325 kPa (sea level). <a class="link" href="../ESE4025_Numericals.html">back to the numericals</a></p><div id="c"></div></div><script>/* Interactive psychrometric chart (ASHRAE equations, 101.325 kPa) with the

    var solve = hd('label', {}), cb = hd('input', { type: 'checkbox' }); cb.checked = o.solveADP; solve.appendChild(cb); solve.appendChild(document.createTextNode(' find ADP from RSH/RLH'));
